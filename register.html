<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#020812" />
<title>إنشاء حساب | SAYODA CYBER FORCE</title>
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./logo.png" />
<link rel="apple-touch-icon" href="./logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --blue:#19aaff; --blue-2:#0b7fd4; --bg:#020812; --bg-2:#061024;
  --card:rgba(12,22,44,.72); --border:rgba(25,170,255,.22);
  --txt:#eaf4ff; --muted:#9fb3cc; --danger:#ff4d6d; --ok:#28d17c;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif;-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt); min-height:100vh;
  display:flex; align-items:center; justify-content:center; padding:20px;
  position:relative; overflow-x:hidden;
}
.bg-layer{position:fixed;inset:0;z-index:0;
  background:url('./bg.png') center/cover no-repeat;
  filter:brightness(.42) saturate(1.1);pointer-events:none}
.bg-overlay{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(circle at 50% 20%,rgba(25,170,255,.18),transparent 55%),
             linear-gradient(180deg,rgba(2,8,18,.55),rgba(2,8,18,.92));}
.grid-fx{position:fixed;inset:0;z-index:1;opacity:.25;pointer-events:none;
  background-image:linear-gradient(rgba(25,170,255,.12) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(25,170,255,.12) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(circle at 50% 30%,#000 20%,transparent 75%);}

.card{position:relative;z-index:2;width:100%;max-width:440px;
  background:var(--card);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:1px solid var(--border);border-radius:26px;padding:32px 26px;
  box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.03) inset;
  animation:pop .6s cubic-bezier(.2,.9,.3,1.4);}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}

.logo-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:22px}
.logo-wrap img{width:80px;height:80px;object-fit:contain;pointer-events:none;
  filter:drop-shadow(0 0 22px rgba(25,170,255,.6));animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.brand{font-size:20px;font-weight:900;letter-spacing:1px;text-align:center}
.brand span{color:var(--blue)}
.sub{color:var(--muted);font-size:13px;text-align:center;margin-top:2px}

.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:#cfe3fb}
.field label .opt{color:var(--muted);font-weight:500;font-size:11px}
.input-box{position:relative}
.input-box svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--blue);opacity:.8;pointer-events:none}
.field input{width:100%;padding:14px 44px 14px 44px;border-radius:14px;
  background:rgba(3,10,22,.7);border:1px solid var(--border);color:var(--txt);
  font-size:15px;transition:.25s;outline:none;-webkit-user-select:text;user-select:text}
.field input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(25,170,255,.15)}
.toggle-eye{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;display:flex}
.hint{font-size:11px;color:var(--muted);margin-top:5px;display:block}

.strength{height:5px;border-radius:5px;background:rgba(3,10,22,.6);margin-top:6px;overflow:hidden;border:1px solid var(--border)}
.strength i{display:block;height:100%;width:0%;transition:width .3s,background .3s;background:var(--danger)}

.btn{width:100%;padding:15px;border:none;border-radius:14px;cursor:pointer;
  background:linear-gradient(135deg,var(--blue),var(--blue-2));color:#021226;
  font-size:16px;font-weight:900;letter-spacing:.5px;
  transition:transform .15s,box-shadow .25s;box-shadow:0 10px 30px rgba(25,170,255,.35)}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn .spinner{width:20px;height:20px;border:3px solid rgba(2,18,38,.3);
  border-top-color:#021226;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

.btn-ghost{width:100%;padding:15px;border:1px solid var(--border);border-radius:14px;cursor:pointer;
  background:transparent;color:var(--txt);font-size:15px;font-weight:800;margin-top:10px;transition:.2s}
.btn-ghost:hover{background:rgba(25,170,255,.1);border-color:var(--blue)}

.msg{margin-top:16px;padding:12px 14px;border-radius:12px;font-size:14px;font-weight:600;
  display:none;text-align:center;animation:pop .3s}
.msg.err{display:block;background:rgba(255,77,109,.14);border:1px solid rgba(255,77,109,.4);color:#ff9db0}
.msg.ok{display:block;background:rgba(40,209,124,.14);border:1px solid rgba(40,209,124,.4);color:#7ff0b8}

.foot{margin-top:22px;text-align:center;font-size:12px;color:var(--muted)}
.foot b{color:var(--blue)}
.ripple{position:absolute;border-radius:50%;background:rgba(2,18,38,.35);transform:scale(0);animation:rip .6s linear;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
</style>
</head>
<body>
<div class="bg-layer"></div>
<div class="bg-overlay"></div>
<div class="grid-fx"></div>

<div class="card">
  <div class="logo-wrap">
    <img src="./logo.png" alt="logo" onerror="this.style.display='none'" />
    <div class="brand">SAYODA <span>| CYBER FORCE</span></div>
    <div class="sub">✨ أنشئ حسابك وابدأ التعلم</div>
  </div>

  <form id="registerForm" autocomplete="off">
    <div class="field">
      <label>اسم المستخدم</label>
      <div class="input-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input type="text" id="username" placeholder="اختر اسم مستخدم (3 أحرف على الأقل)" required autocomplete="username" minlength="3" maxlength="30" />
      </div>
      <small class="hint">حروف إنجليزية وأرقام فقط، بدون مسافات</small>
    </div>

    <div class="field">
      <label>كلمة المرور</label>
      <div class="input-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="password" placeholder="6 أحرف على الأقل" required autocomplete="new-password" minlength="6" />
        <button type="button" class="toggle-eye" id="toggleEye1" aria-label="show">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="strength"><i id="strengthBar"></i></div>
    </div>

    <div class="field">
      <label>تأكيد كلمة المرور</label>
      <div class="input-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="confirm" placeholder="أعد كتابة كلمة المرور" required autocomplete="new-password" />
        <button type="button" class="toggle-eye" id="toggleEye2" aria-label="show">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="field">
      <label>كود الدعوة <span class="opt">(اختياري)</span></label>
      <div class="input-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12v10H4V12"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
        <input type="text" id="refCode" placeholder="مثال: SAYODA-XXXX-0000" maxlength="30" style="text-transform:uppercase" autocomplete="off" />
      </div>
      <small class="hint">لو حد دعاك، اكتب كوده هنا (اختياري)</small>
    </div>

    <button type="submit" class="btn" id="submitBtn">إنشاء الحساب</button>
    <button type="button" class="btn-ghost" onclick="location.href='./login.html'">← لدي حساب بالفعل</button>
  </form>

  <div class="msg" id="msg"></div>
  <div class="foot">© 2026 SAYODA <b>CYBER FORCE</b> — جميع الحقوق محفوظة</div>
</div>

<script>
/* ============ الحمايات ============ */
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('dragstart',e=>e.preventDefault());
document.addEventListener('selectstart',e=>{if(!e.target.closest('input,textarea'))e.preventDefault();});
document.addEventListener('copy',e=>{if(!e.target.closest('input,textarea'))e.preventDefault();});
document.addEventListener('cut',e=>{if(!e.target.closest('input,textarea'))e.preventDefault();});
document.addEventListener('keydown',e=>{
  if(e.key==='F12'){e.preventDefault();e.stopPropagation();return false;}
  if(e.ctrlKey&&e.shiftKey&&['I','J','C','K'].includes(e.key.toUpperCase())){e.preventDefault();e.stopPropagation();return false;}
  if(e.ctrlKey&&['U','S','P'].includes(e.key.toUpperCase())){e.preventDefault();e.stopPropagation();return false;}
  if(e.metaKey&&e.altKey&&['I','J','C','U'].includes(e.key.toUpperCase())){e.preventDefault();e.stopPropagation();return false;}
  if(e.key==='PrintScreen'){e.preventDefault();try{navigator.clipboard.writeText('');}catch(err){}}
});

/* ============ CONFIG ============ */
const SUPABASE_URL="https://brawrhpvtnzvvrzkguic.supabase.co";
const SUPABASE_KEY="sb_publishable_Q8fBS3nVZqgvfd6diaul8A_cMvHUFtN";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const clean = s => String(s||'').replace(/[<>]/g,'').trim();

try{
  const s = JSON.parse(localStorage.getItem('sayoda_session')||'null');
  if(s && s.username && s.token){
    location.replace(s.role==='admin' ? './admin.html' : './index.html');
  }
}catch(e){}

function showMsg(t, type){
  const m = $('msg');
  m.className = 'msg ' + type;
  m.textContent = t;
  window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});
}

$('toggleEye1').onclick = () => {
  const p = $('password');
  p.type = p.type === 'password' ? 'text' : 'password';
};
$('toggleEye2').onclick = () => {
  const p = $('confirm');
  p.type = p.type === 'password' ? 'text' : 'password';
};

$('password').addEventListener('input', e => {
  const v = e.target.value;
  let score = 0;
  if(v.length >= 6) score++;
  if(v.length >= 10) score++;
  if(/[A-Z]/.test(v)) score++;
  if(/[0-9]/.test(v)) score++;
  if(/[^A-Za-z0-9]/.test(v)) score++;
  const bar = $('strengthBar');
  const pct = (score / 5) * 100;
  bar.style.width = pct + '%';
  if(score <= 1) bar.style.background = '#ff4d6d';
  else if(score <= 3) bar.style.background = '#ffb020';
  else bar.style.background = '#28d17c';
});

document.querySelectorAll('.btn, .btn-ghost').forEach(b => b.addEventListener('click', function(e){
  const c = document.createElement('span');
  c.className = 'ripple';
  const r = this.getBoundingClientRect();
  const d = Math.max(r.width, r.height);
  c.style.width = c.style.height = d + 'px';
  c.style.left = (e.clientX - r.left - d/2) + 'px';
  c.style.top = (e.clientY - r.top - d/2) + 'px';
  this.appendChild(c);
  setTimeout(()=>c.remove(), 600);
}));

/* كود الدعوة بأحرف كبيرة تلقائياً */
$('refCode').addEventListener('input', e => {
  e.target.value = e.target.value.toUpperCase().replace(/\s/g,'');
});

$('registerForm').addEventListener('submit', async e => {
  e.preventDefault();

  const username = clean($('username').value);
  const password = $('password').value;
  const confirm  = $('confirm').value;
  const refCode  = clean($('refCode').value).toUpperCase();

  if(!username || !password || !confirm){
    return showMsg('⚠️ الرجاء ملء جميع الحقول المطلوبة', 'err');
  }
  if(!/^[A-Za-z0-9_]+$/.test(username)){
    return showMsg('⚠️ اسم المستخدم: حروف إنجليزية وأرقام و _ فقط', 'err');
  }
  if(username.length < 3){
    return showMsg('⚠️ اسم المستخدم قصير جداً (3 أحرف على الأقل)', 'err');
  }
  if(password.length < 6){
    return showMsg('⚠️ كلمة المرور قصيرة (6 أحرف على الأقل)', 'err');
  }
  if(password !== confirm){
    return showMsg('⚠️ كلمتا المرور غير متطابقتين', 'err');
  }

  const btn = $('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';

  try{
    /* --- إنشاء الحساب --- */
    const { data, error } = await sb.rpc('secure_register', {
      p_username: username,
      p_password: password
    });

    if(error) throw error;

    const res = Array.isArray(data) ? data[0] : data;

    if(!res || !res.ok){
      const code = res && res.error;
      if(code === 'username_exists'){
        showMsg('❌ اسم المستخدم موجود بالفعل، جرّب اسم آخر', 'err');
      } else if(code === 'username_short'){
        showMsg('⚠️ اسم المستخدم قصير جداً', 'err');
      } else if(code === 'password_short'){
        showMsg('⚠️ كلمة المرور قصيرة جداً', 'err');
      } else {
        showMsg('⚠️ تعذّر إنشاء الحساب', 'err');
      }
      throw new Error('failed');
    }

    /* --- استخدام كود الدعوة (اختياري) --- */
    if(refCode){
      try{
        await sb.rpc('apply_referral_code', {
          p_new_user: username,
          p_code: refCode
        });
      }catch(err){
        // لو كود غلط، مش مشكلة — الحساب اتعمل
        console.warn('Referral code failed:', err);
      }
    }

    showMsg('✅ تم إنشاء حسابك بنجاح! جاري تسجيل الدخول...', 'ok');

    /* --- تسجيل دخول تلقائي --- */
    const { data: loginData, error: loginErr } = await sb.rpc('secure_login', {
      p_username: username,
      p_password: password
    });

    if(loginErr) throw loginErr;
    const loginRes = Array.isArray(loginData) ? loginData[0] : loginData;

    if(loginRes && loginRes.ok){
      localStorage.setItem('sayoda_session', JSON.stringify({
        username: loginRes.username,
        role: loginRes.role,
        token: loginRes.token,
        ts: Date.now()
      }));
      setTimeout(()=>{
        location.replace((loginRes.role === 'admin') ? './admin.html' : './index.html');
      }, 900);
    } else {
      setTimeout(()=>location.replace('./login.html'), 1200);
    }

  }catch(err){
    if(err.message !== 'failed'){
      showMsg('⚠️ خطأ في الاتصال بالخادم', 'err');
    }
  }finally{
    btn.disabled = false;
    btn.textContent = 'إنشاء الحساب';
  }
});

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
}
</script>
</body>
</html>
