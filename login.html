<style>
:root{
  --blue:#19aaff; --blue-2:#0b7fd4; --blue-3:#00d4ff;
  --bg:#020812; --bg-2:#061024;
  --card:rgba(12,22,44,.72); --border:rgba(25,170,255,.22);
  --txt:#eaf4ff; --muted:#9fb3cc; --danger:#ff4d6d; --ok:#28d17c;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overflow-x:hidden}
body{
  background:var(--bg); color:var(--txt); min-height:100vh;
  display:flex; align-items:center; justify-content:center; padding:20px;
  position:relative;
}

/* ============ BACKGROUND ============ */
.bg-layer{
  position:fixed;inset:0;z-index:0;
  background:url('./bg.png') center/cover no-repeat;
  filter:brightness(.42) saturate(1.1);
}
.bg-overlay{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(circle at 50% 20%,rgba(25,170,255,.18),transparent 55%),
    linear-gradient(180deg,rgba(2,8,18,.55),rgba(2,8,18,.92));
}
.grid-fx{
  position:fixed;inset:0;z-index:1;opacity:.25;pointer-events:none;
  background-image:
    linear-gradient(rgba(25,170,255,.12) 1px,transparent 1px),
    linear-gradient(90deg,rgba(25,170,255,.12) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(circle at 50% 30%,#000 20%,transparent 75%);
  -webkit-mask-image:radial-gradient(circle at 50% 30%,#000 20%,transparent 75%);
}

/* ============ ROBOT ============ */
.robot-stage{
  position:fixed;
  bottom:-300px;
  left:50%;
  transform:translateX(-50%);
  z-index:100;
  pointer-events:none;
  opacity:0;
  animation:robotStageAnim 9s ease-in-out 0.5s forwards;
}
@keyframes robotStageAnim{
  0%{opacity:0;bottom:-300px}
  11%{opacity:1;bottom:20px}
  25%{opacity:1;bottom:20px}
  35%{opacity:1;bottom:20px}
  50%{opacity:1;bottom:100px}
  65%{opacity:0;bottom:calc(100vh + 100px)}
  100%{opacity:0;bottom:calc(100vh + 100px)}
}
.robot{
  width:200px;height:240px;
  filter:drop-shadow(0 0 30px rgba(25,170,255,.5));
}
.robot-shadow{
  animation:shadowPulse 2s ease-in-out infinite;
  transform-origin:center;
}
@keyframes shadowPulse{
  0%,100%{opacity:.3;transform:scaleX(1)}
  50%{opacity:.15;transform:scaleX(.7)}
}
.robot-eye-l, .robot-eye-r{
  animation:eyeOpen 9s ease-in-out .5s forwards;
  transform-origin:center;
  transform:scaleY(.1);
}
@keyframes eyeOpen{
  0%{transform:scaleY(.1)}
  15%{transform:scaleY(.1)}
  20%{transform:scaleY(.5)}
  25%{transform:scaleY(1)}
  100%{transform:scaleY(1)}
}
.robot-pupil-l, .robot-pupil-r{
  animation:pupilAppear 9s ease-in-out .5s forwards;
  opacity:0;
}
@keyframes pupilAppear{
  0%,20%{opacity:0}
  25%{opacity:1}
  100%{opacity:1}
}
.robot-mouth{
  animation:mouthSmile 9s ease-in-out .5s forwards;
}
@keyframes mouthSmile{
  0%,20%{d:path("M 85 112 Q 100 112 115 112")}
  30%{d:path("M 82 108 Q 100 122 118 108")}
  100%{d:path("M 82 108 Q 100 122 118 108")}
}
.robot-cheek-l, .robot-cheek-r{
  animation:cheekAppear 9s ease-in-out .5s forwards;
  opacity:0;
}
@keyframes cheekAppear{
  0%,25%{opacity:0}
  30%{opacity:.5}
  100%{opacity:.5}
}
.robot-head{
  animation:headMove 9s ease-in-out .5s forwards;
  transform-origin:100px 130px;
}
@keyframes headMove{
  0%,20%{transform:rotate(0deg) translateX(0)}
  30%{transform:rotate(-3deg) translateX(-5px)}
  40%{transform:rotate(-3deg) translateX(-5px)}
  50%{transform:rotate(5deg) translateX(0)}
  70%{transform:rotate(-15deg) translateX(30px)}
  100%{transform:rotate(-15deg) translateX(30px)}
}
.robot-antenna{
  animation:antennaPulse 1.5s ease-in-out infinite;
}
@keyframes antennaPulse{
  0%,100%{opacity:1}
  50%{opacity:.6}
}
.robot-chest-inner{
  animation:chestPulse 2s ease-in-out infinite;
  transform-origin:100px 160px;
}
@keyframes chestPulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.5;transform:scale(.8)}
}
.robot-arm-l{
  animation:armWaveL 2s ease-in-out infinite;
  transform-origin:49px 130px;
}
.robot-arm-r{
  animation:armWaveR 2s ease-in-out infinite;
  transform-origin:151px 130px;
}
@keyframes armWaveL{
  0%,100%{transform:rotate(0)}
  50%{transform:rotate(10deg)}
}
@keyframes armWaveR{
  0%,100%{transform:rotate(0)}
  50%{transform:rotate(-10deg)}
}

/* ============ CARD ============ */
.card{
  position:relative;z-index:2;width:100%;max-width:440px;
  background:var(--card);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border:1px solid var(--border);
  border-radius:28px;
  padding:36px 28px;
  box-shadow:
    0 30px 80px rgba(0,0,0,.55),
    0 0 0 1px rgba(255,255,255,.03) inset,
    0 0 80px rgba(25,170,255,.1);
  animation:pop .6s cubic-bezier(.2,.9,.3,1.4);
}
@keyframes pop{
  from{opacity:0;transform:translateY(30px) scale(.96)}
  to{opacity:1;transform:none}
}

.logo-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:28px}
.logo-wrap img{
  width:110px;height:110px;object-fit:contain;pointer-events:none;
  filter:drop-shadow(0 0 24px rgba(25,170,255,.7)) drop-shadow(0 0 8px rgba(25,170,255,.5));
  animation:float 4s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}
.brand{font-size:22px;font-weight:900;letter-spacing:1px;text-align:center}
.brand span{color:var(--blue)}
.sub{color:var(--muted);font-size:13px;text-align:center;margin-top:2px}

.field{margin-bottom:18px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:8px;color:#cfe3fb}
.input-box{position:relative}
.input-box svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--blue);opacity:.8;pointer-events:none}
.field input{
  width:100%;padding:14px 44px 14px 44px;border-radius:14px;
  background:rgba(3,10,22,.7);border:1px solid var(--border);color:var(--txt);
  font-size:15px;transition:.25s;outline:none;
  -webkit-user-select:text;user-select:text;
}
.field input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 4px rgba(25,170,255,.15),0 0 20px rgba(25,170,255,.2);
}
.toggle-eye{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--muted);cursor:pointer;padding:6px;
  display:flex;transition:.2s;border-radius:8px;
}
.toggle-eye:hover{color:var(--blue);background:rgba(25,170,255,.1)}

.btn{
  width:100%;padding:15px;border:none;border-radius:14px;cursor:pointer;
  background:linear-gradient(135deg,var(--blue),var(--blue-2));color:#021226;
  font-size:16px;font-weight:900;letter-spacing:.5px;position:relative;overflow:hidden;
  transition:transform .15s,box-shadow .25s;
  box-shadow:0 10px 30px rgba(25,170,255,.35);
}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(25,170,255,.5)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn .spinner{
  width:20px;height:20px;border:3px solid rgba(2,18,38,.3);
  border-top-color:#021226;border-radius:50%;animation:spin .7s linear infinite;
  display:inline-block;vertical-align:middle;
}
@keyframes spin{to{transform:rotate(360deg)}}

.btn-ghost{
  width:100%;padding:15px;border:1px solid var(--border);border-radius:14px;cursor:pointer;
  background:transparent;color:var(--txt);font-size:15px;font-weight:800;
  margin-top:10px;transition:.2s;
}
.btn-ghost:hover{background:rgba(25,170,255,.1);border-color:var(--blue)}

.msg{
  margin-top:16px;padding:12px 14px;border-radius:12px;font-size:14px;font-weight:600;
  display:none;text-align:center;animation:pop .3s;
}
.msg.err{display:block;background:rgba(255,77,109,.14);border:1px solid rgba(255,77,109,.4);color:#ff9db0}
.msg.ok{display:block;background:rgba(40,209,124,.14);border:1px solid rgba(40,209,124,.4);color:#7ff0b8}

.foot{margin-top:22px;text-align:center;font-size:12px;color:var(--muted);line-height:1.6}
.foot b{color:var(--blue)}

.ripple{
  position:absolute;border-radius:50%;background:rgba(2,18,38,.35);
  transform:scale(0);animation:rip .6s linear;pointer-events:none;
}
@keyframes rip{to{transform:scale(4);opacity:0}}

@media(max-width:560px){
  .card{padding:28px 20px}
  .logo-wrap img{width:90px;height:90px}
  .brand{font-size:19px}
  .robot{width:150px;height:180px}
}
</style>
</head>
<body>

<div class="robot-stage" id="robotStage">

    <rect class="robot-arm-l" x="40" y="130" width="18" height="50" rx="9" fill="url(#bodyGrad)" stroke="#19aaff" stroke-width="2"/>
    <rect class="robot-arm-r" x="142" y="130" width="18" height="50" rx="9" fill="url(#bodyGrad)" stroke="#19aaff" stroke-width="2"/>

<!-- ============ LOGIN CARD ============ -->
<div class="card">
  <div class="logo-wrap">
    <img src="./logo.png" alt="logo" onerror="this.style.display='none'" />
    <div class="brand">CYBER <span>FORCE</span></div>
    <div class="sub">🔐 منصة التعلّم الأمنية الاحترافية</div>
  </div>

  <form id="loginForm" autocomplete="off">
    <div class="field">
      <label>اسم المستخدم</label>
      <div class="input-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input type="text" id="username" placeholder="ادخل اسم المستخدم" required autocomplete="username" />
      </div>
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <div class="input-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="password" placeholder="ادخل كلمة المرور" required autocomplete="current-password" />
        <button type="button" class="toggle-eye" id="toggleEye" aria-label="show">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <button type="submit" class="btn" id="submitBtn">تسجيل الدخول</button>

  <div class="msg" id="msg"></div>

<script>
/* ============ الحمايات ============ */
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('dragstart',e=>e.preventDefault());
document.addEventListener('selectstart',e=>{if(!e.target.closest('input,textarea'))e.preventDefault();});
document.addEventListener('copy',e=>{if(!e.target.closest('input,textarea'))e.preventDefault();});
document.addEventListener('cut',e=>{if(!e.target.closest('input,textarea'))e.preventDefault();});
document.addEventListener('keydown',e=>{
  if(e.key==='F12'){e.preventDefault();e.stopPropagation();return false;}
  if(e.ctrlKey&&e.shiftKey&&['I','J','C','K'].includes(e.key.toUpperCase())){e.preventDefault();e.stopPropagation();return false;}
  if(e.ctrlKey&&['U','S','P'].includes(e.key.toUpperCase())){e.preventDefault();e.stopPropagation();return false;}
  if(e.metaKey&&e.altKey&&['I','J','C','U'].includes(e.key.toUpperCase())){e.preventDefault();e.stopPropagation();return false;}
  if(e.key==='PrintScreen'){e.preventDefault();try{navigator.clipboard.writeText('');}catch(err){}}
});

/* ============ CONFIG ============ */
const SUPABASE_URL="https://brawrhpvtnzvvrzkguic.supabase.co";
const SUPABASE_KEY="sb_publishable_Q8fBS3nVZqgvfd6diaul8A_cMvHUFtN";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const MAX_ATTEMPTS = 5;
const LOCK_MS = 5 * 60 * 1000;

const $ = id => document.getElementById(id);
const clean = s => String(s||'').replace(/[<>]/g,'').trim();

/* ============ SESSION CHECK ============ */
try{
  const s = JSON.parse(localStorage.getItem('sayoda_session')||'null');
  if(s && s.username && s.token){
    if(s.role === 'admin'){
      location.replace('./admin.html');
    } else if(s.role === 'instructor'){
      location.replace('./instructor.html');
    } else {
      location.replace('./index.html');
    }
  }
}catch(e){}

function showMsg(t, type){
  const m = $('msg');
  m.className = 'msg ' + type;
  m.textContent = t;
}
function getLock(){
  try{ return JSON.parse(localStorage.getItem('sayoda_lock')||'{"n":0,"t":0}'); }
  catch(e){ return {n:0, t:0}; }
}
function setLock(o){ localStorage.setItem('sayoda_lock', JSON.stringify(o)); }

$('toggleEye').onclick = () => {
  const p = $('password');
  p.type = p.type === 'password' ? 'text' : 'password';
};

document.querySelectorAll('.btn, .btn-ghost').forEach(b => b.addEventListener('click', function(e){
  const c = document.createElement('span');
  c.className = 'ripple';
  const r = this.getBoundingClientRect();
  const d = Math.max(r.width, r.height);
  c.style.width = c.style.height = d + 'px';
  c.style.left = (e.clientX - r.left - d/2) + 'px';
  c.style.top = (e.clientY - r.top - d/2) + 'px';
  this.appendChild(c);
  setTimeout(()=>c.remove(), 600);
}));

/* ============ LOGIN ============ */
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();

  const lock = getLock();
  if(lock.t && Date.now() < lock.t){
    const left = Math.ceil((lock.t - Date.now()) / 60000);
    return showMsg(`🚫 تم قفل الدخول مؤقتاً. حاول بعد ${left} دقيقة.`, 'err');
  }

  const username = clean($('username').value);
  const password = $('password').value;

  if(!username || !password){
    return showMsg('⚠️ الرجاء ملء جميع الحقول', 'err');
  }

  const btn = $('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>';

  try{
    const { data, error } = await sb.rpc('secure_login', {
      p_username: username,
      p_password: password
    });

    if(error) throw error;

    const res = Array.isArray(data) ? data[0] : data;

    if(!res || !res.ok){
      const code = res && res.error;

      if(code === 'inactive'){
        showMsg('⛔ حسابك موقوف. تواصل مع الإدارة.', 'err');
        throw new Error('inactive');
      }
      if(code === 'not_found'){
        showMsg('❌ اسم المستخدم غير موجود. أنشئ حساباً جديداً.', 'err');
        throw new Error('not_found');
      }

      const nl = { n: (lock.n||0) + 1, t: 0 };
      if(nl.n >= MAX_ATTEMPTS){
        nl.t = Date.now() + LOCK_MS;
        nl.n = 0;
        showMsg('🚫 محاولات كثيرة! تم القفل لمدة 5 دقائق.', 'err');
      } else {
        showMsg(`❌ بيانات غير صحيحة (محاولة ${nl.n}/${MAX_ATTEMPTS})`, 'err');
      }
      setLock(nl);
      throw new Error('bad');
    }

    setLock({ n: 0, t: 0 });

    /* تحديد الدور */
    let role = res.role || 'student';
    let isInstructor = false;

    try{
      const { data: uData } = await sb.from('users')
        .select('role, is_instructor')
        .eq('username', res.username)
        .limit(1);
      if(uData && uData[0]){
        role = uData[0].role || role;
        isInstructor = uData[0].is_instructor === true;
      }
    }catch(e){ console.warn('role check error:', e); }

    localStorage.setItem('sayoda_session', JSON.stringify({
      username: res.username,
      role: role,
      is_instructor: isInstructor,
      token: res.token,
      ts: Date.now()
    }));

    try{ await sb.rpc('update_last_login', { p_username: res.username }); }catch(e){}

    try{
      await sb.rpc('client_log_activity', {
        p_username: res.username,
        p_activity_type: 'login',
        p_details: JSON.stringify({ role: role, is_instructor: isInstructor }),
        p_user_agent: navigator.userAgent.slice(0,200)
      });
    }catch(e){}

    /* تحديد الوجهة */
    let destination = './index.html';
    let welcomeMsg = '✅ تم الدخول بنجاح! جاري التحويل...';

    if(role === 'admin' && isInstructor){
      destination = './instructor.html';
      welcomeMsg = '👑 مرحباً أيها المدير-المدرب! جاري التحويل...';
    } else if(role === 'admin'){
      destination = './admin.html';
      welcomeMsg = '👑 مرحباً أيها المدير! جاري التحويل...';
    } else if(role === 'instructor'){
      destination = './instructor.html';
      welcomeMsg = '🎬 مرحباً أيها المدرب! جاري التحويل...';
    }

    showMsg(welcomeMsg, 'ok');
    setTimeout(() => {
      location.replace(destination);
    }, 800);

  }catch(err){
    if(!['bad','inactive','not_found'].includes(err.message)){
      showMsg('⚠️ خطأ في الاتصال بالخادم', 'err');
    }
  }finally{
    btn.disabled = false;
    btn.textContent = 'تسجيل الدخول';
  }
});

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
}
</script>
</body>
</html>
